<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
    }
    .status.connected { background: #34c759; }
    .status.connecting { background: #ff9500; }
    .status.disconnected { background: #ff3b30; }
    .field {
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-size: 11px;
      color: #666;
      margin-bottom: 3px;
    }
    .field input {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }
    .field .value {
      padding: 5px 0;
      font-size: 12px;
      word-break: break-all;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 7px 0;
      border: none;
      border-radius: 4px;
      background: #4a90d9;
      color: white;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #3a7bc8; }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .last-import {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
      font-size: 11px;
      color: #666;
    }
    .last-import .ok { color: #34c759; }
    .last-import .fail { color: #ff3b30; }
  </style>
</head>
<body>
  <h1>
    <span id="status-dot" class="status disconnected"></span>
    CodexBarX Bridge
  </h1>

  <div class="field">
    <label>Profile ID</label>
    <div class="value" id="profile-id">—</div>
  </div>

  <div class="field">
    <label>Alias</label>
    <input type="text" id="alias-input" placeholder="Work Chrome" maxlength="40">
  </div>

  <div class="actions">
    <button id="save-alias-btn">Save Alias</button>
    <button id="reconnect-btn">Reconnect</button>
  </div>

  <div class="last-import" id="last-import" style="display:none">
    Last import: <span id="last-import-status">—</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
