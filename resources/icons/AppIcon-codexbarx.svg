<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Quota radar icon preview</title>
  <desc id="desc">A glass quota radar symbol with segmented usage arcs, reset ticks, a live sampling core, and provider nodes.</desc>
  <defs>
    <linearGradient id="glassBase" x1="44" y1="26" x2="212" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29284b"/>
      <stop offset=".43" stop-color="#18172f"/>
      <stop offset="1" stop-color="#0f1528"/>
    </linearGradient>
    <radialGradient id="glassBloom" cx="88" cy="52" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".42" stop-color="#5c66ff" stop-opacity=".11"/>
      <stop offset="1" stop-color="#050713" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="128" cy="128" r="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset=".23" stop-color="#7ce7f0"/>
      <stop offset=".58" stop-color="#49a3b0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#49a3b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sessionArc" x1="113" y1="38" x2="210" y2="93" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".42" stop-color="#85f5ff"/>
      <stop offset="1" stop-color="#49a3b0"/>
    </linearGradient>
    <linearGradient id="weeklyArc" x1="207" y1="112" x2="143" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd261"/>
      <stop offset=".54" stop-color="#ffb21f"/>
      <stop offset="1" stop-color="#e8654e"/>
    </linearGradient>
    <linearGradient id="creditArc" x1="99" y1="216" x2="42" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fe38d"/>
      <stop offset=".55" stop-color="#34e8bb"/>
      <stop offset="1" stop-color="#62a8ff"/>
    </linearGradient>
    <filter id="softShadow" x="-28%" y="-28%" width="156%" height="156%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#050713" flood-opacity=".58"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6c6fff" flood-opacity=".22"/>
    </filter>
    <filter id="aquaGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="18" y="16" width="220" height="224" rx="52" fill="url(#glassBase)" filter="url(#softShadow)"/>
  <rect x="20" y="18" width="216" height="220" rx="50" fill="url(#glassBloom)"/>
  <path d="M56 29h98c38 0 69 31 69 69v13C196 81 156 59 106 59H36V49c0-11 9-20 20-20Z" fill="#ffffff" opacity=".09"/>
  <rect x="19.5" y="17.5" width="217" height="221" rx="51" fill="none" stroke="#ffffff" stroke-opacity=".18"/>
  <rect x="26" y="24" width="204" height="208" rx="45" fill="none" stroke="#6d70ff" stroke-opacity=".12"/>

  <g opacity=".96">
    <circle cx="128" cy="128" r="87" fill="none" stroke="#343356" stroke-width="10" opacity=".72"/>
    <circle cx="128" cy="128" r="64" fill="none" stroke="#5c628c" stroke-width="1.5" opacity=".34"/>
    <circle cx="128" cy="128" r="39" fill="none" stroke="#5c628c" stroke-width="1.5" opacity=".28"/>
    <path d="M128 41 A87 87 0 0 1 207.5 92.6" fill="none" stroke="url(#sessionArc)" stroke-width="10" stroke-linecap="round"/>
    <path d="M215 128 A87 87 0 0 1 156.7 210.2" fill="none" stroke="url(#weeklyArc)" stroke-width="10" stroke-linecap="round"/>
    <path d="M99.3 210.2 A87 87 0 0 1 41 128" fill="none" stroke="url(#creditArc)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g stroke="#eef7ff" stroke-linecap="round" opacity=".36">
    <line x1="128" y1="56" x2="128" y2="66" stroke-width="2.4"/>
    <line x1="128" y1="56" x2="128" y2="63" stroke-width="1.8" transform="rotate(30 128 128)"/>
    <line x1="128" y1="56" x2="128" y2="66" stroke-width="2.4" transform="rotate(60 128 128)"/>
    <line x1="128" y1="56" x2="128" y2="63" stroke-width="1.8" transform="rotate(90 128 128)"/>
    <line x1="128" y1="56" x2="128" y2="66" stroke-width="2.4" transform="rotate(120 128 128)"/>
    <line x1="128" y1="56" x2="128" y2="63" stroke-width="1.8" transform="rotate(150 128 128)"/>
    <line x1="128" y1="56" x2="128" y2="66" stroke-width="2.4" transform="rotate(180 128 128)"/>
    <line x1="128" y1="56" x2="128" y2="63" stroke-width="1.8" transform="rotate(210 128 128)"/>
    <line x1="128" y1="56" x2="128" y2="66" stroke-width="2.4" transform="rotate(240 128 128)"/>
    <line x1="128" y1="56" x2="128" y2="63" stroke-width="1.8" transform="rotate(270 128 128)"/>
    <line x1="128" y1="56" x2="128" y2="66" stroke-width="2.4" transform="rotate(300 128 128)"/>
    <line x1="128" y1="56" x2="128" y2="63" stroke-width="1.8" transform="rotate(330 128 128)"/>
  </g>

  <g opacity=".48" stroke="#94f4ff" stroke-linecap="round">
    <line x1="128" y1="75" x2="128" y2="181" stroke-width="1.3"/>
    <line x1="75" y1="128" x2="181" y2="128" stroke-width="1.3"/>
    <path d="M128 128 L177 105 A55 55 0 0 1 184 141 Z" fill="#49a3b0" fill-opacity=".15" stroke="none"/>
    <path d="M128 128 L184 141" stroke-width="2.2" opacity=".68"/>
  </g>

  <g>
    <circle cx="128" cy="128" r="49" fill="url(#coreGlow)" opacity=".72" filter="url(#aquaGlow)"/>
    <circle cx="128" cy="128" r="18" fill="#49a3b0" opacity=".82"/>
    <circle cx="128" cy="128" r="10" fill="#f6fbff"/>
    <circle cx="128" cy="128" r="3.8" fill="#12152d"/>
  </g>

  <g stroke="#172033" stroke-width="3.5">
    <circle cx="185" cy="69" r="7.5" fill="#86f5ff"/>
    <circle cx="213" cy="148" r="6.5" fill="#ffd04e"/>
    <circle cx="157" cy="214" r="7" fill="#e8654e"/>
    <circle cx="73" cy="190" r="6.5" fill="#34e8bb"/>
    <circle cx="43" cy="111" r="6.5" fill="#62a8ff"/>
    <circle cx="93" cy="47" r="6" fill="#a997ff"/>
  </g>
  <g stroke="#d6fbff" stroke-linecap="round" stroke-width="1.4" opacity=".28">
    <path d="M185 69 C160 58 122 58 93 47"/>
    <path d="M213 148 C187 186 169 202 157 214"/>
    <path d="M73 190 C57 164 47 139 43 111"/>
  </g>
</svg>
